<!DOCTYPE html>
<!-- Still renders of the CAD model for the website.
     Open through a server that accepts POST /save/<name> (see tools/README.md),
     e.g. http://localhost:8100/tools/render.html?save . Without ?save it only previews.
     ?shot=<name> previews a single shot. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Render stills</title>
<style>
  body { margin: 0; background: #ddd; font: 14px system-ui; }
  canvas { display: block; width: 800px; height: 600px; }
  #log { padding: 8px; white-space: pre; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script src="../assets/model-data.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="log"></div>
<script type="module">
import { createPlanter } from "../assets/planter3d.js";

const W = 1600, H = 1200;
const q = new URLSearchParams(location.search);
const canvas = document.getElementById("c");
const P = createPlanter(canvas, { background: null, preserveDrawingBuffer: true, pixelRatio: 1 });
P.resize(W, H);
canvas.style.width = "800px"; canvas.style.height = "600px";

const ALL = Object.keys(P.parts);
const reset = () => ALL.forEach((n) => P.apply(n, { o: 1, lift: 0, hl: 0, sz: 1 }));
const ghost = (names, o = 0.12) => names.forEach((n) => P.apply(n, { o, lift: 0, hl: 0, sz: 1 }));
const SHELL = ["tank", "top", "lid", "cap"];

const SHOTS = {
  hero: () => { reset(); P.apply("water", { o: 0 }); P.setView(-118, 15, 470, 108); },
  front: () => { reset(); P.apply("water", { o: 0 }); P.setView(-90, 5, 480, 104); },
  back: () => { reset(); P.apply("water", { o: 0 }); P.apply("plant", { o: 1 }); P.setView(62, 14, 450, 98); },
  cutaway: () => { reset(); ghost(SHELL, 0.1); ghost(["soil"], 0.18); P.apply("plant", { o: 0 }); P.setView(-128, 22, 390, 66); },
  water: () => { reset(); ghost(SHELL, 0.1); ghost(["soil", "pcb", "soil_sensor_1", "soil_sensor_2", "dht"], 0.05); P.apply("plant", { o: 0 });
                 ["pump", "tube", "water", "level_sensor", "pump_cable"].forEach((n) => P.apply(n, { o: 1, hl: 0.3 })); P.setView(-110, 14, 360, 50); },
  bay: () => { reset(); ghost(["top", "lid"], 0.1); P.apply("plant", { o: 0 }); ghost(["soil"], 0.25);
               ["pcb", "dht"].forEach((n) => P.apply(n, { o: 1, hl: 0.25 })); P.setView(70, 20, 360, 74); },
  exploded: () => { reset(); P.apply("water", { o: 0 }); P.apply("plant", { o: 0 });
    const L = { top: 75, soil: 75, level_sensor: 75, dht: 75, pcb: 150, soil_sensor_1: 150, soil_sensor_2: 150, stake: 150, lid: 225, cap: 225 };
    Object.entries(L).forEach(([n, lift]) => P.apply(n, { o: 1, lift })); P.apply("soil", { o: 0 }); P.setView(-128, 14, 660, 172); },
};

const log = (s) => (document.getElementById("log").textContent += s + "\n");
async function run() {
  const names = q.get("shot") ? [q.get("shot")] : Object.keys(SHOTS);
  for (const n of names) {
    SHOTS[n]();
    P.render();
    await new Promise((r) => setTimeout(r, 50));
    P.render();
    if (q.has("save")) {
      const res = await fetch("/save/" + n, { method: "POST", body: canvas.toDataURL("image/png") });
      log(n + " -> " + (await res.text()));
    } else log(n);
  }
  log("done");
  window.RENDER_DONE = true;
}
run();
</script>
</body>
</html>
